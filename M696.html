<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Rotational Clay Modeler</title>

<style>
    body {
        margin: 0;
        background: #f0f0f0;
        font-family: sans-serif;
    }

    /* 上段：2D + 3D の2画面 */
    #container {
        display: flex;
        height: 70vh;
        border-bottom: 2px solid #ccc;
    }

    /* 左：2D XZ 断面ビュー */
    #view2d {
        flex: 1;
        background: #ffffff;
        border-right: 2px solid #ccc;
        position: relative;
    }

#xzCanvas {
    width: 100%;
    height: 100%;
    background: #fafafa;
    cursor: url('data:image/svg+xml;utf8,\
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32">\
<line x1="16" y1="0" x2="16" y2="32" stroke="white" stroke-width="4"/>\
<line x1="0" y1="16" x2="32" y2="16" stroke="white" stroke-width="4"/>\
<line x1="16" y1="0" x2="16" y2="32" stroke="black" stroke-width="2"/>\
<line x1="0" y1="16" x2="32" y2="16" stroke="black" stroke-width="2"/>\
</svg>') 16 16, crosshair;

}

    /* 右：3D 粘土ビュー */
    #view3d {
        flex: 1;
        background: #000;
        position: relative;
    }

    #threeContainer {
        width: 100%;
        height: 100%;
    }

    /* 下段：操作パネル */
    button {
        padding: 10px 20px;
        font-size: 16px;
    }

    #loadFileInput {
        display: none;
    }

.angle-btn {
    background: #eee;
    border: 1px solid #ccc;
    padding: 4px 6px;
    border-radius: 4px;
    cursor: pointer;
}

.angle-btn:hover {
    background: #e0e0e0;
}

#controls {
    position: relative;
    padding: 8px 12px 12px 12px; /* 全体の余白を小さく */
    padding-top: 32px; /* タイトルの高さ分だけ確保 */
    height: auto; /* ★ これが重要 */
}
#controlsTitle {
    position: absolute;
    top: 4px;
    left: 8px;
    font-size: 14px;
    font-weight: bold;
    margin: 0;
}

#versionLabel {
    position: absolute;
    top: 4px;
    right: 8px;
    font-size: 12px;
    color: #888;
    pointer-events: none;
}


</style>

</head>

<div id="container">

    <!-- 左：2D XZ 断面ビュー -->
    <div id="view2d">
        <canvas id="xzCanvas"></canvas>
    </div>

</div>

<!-- 下：操作パネル -->
<div id="controls">

        <label>ヘラ半径</label>
        <input type="range" id="radiusSlider" min="1" max="10" value="4">

        <input type="range" id="lenSlider" min="0" max="50" value="0">
    </div>

    <div class="control-group">
        <label>ヘラの傾斜角度</label>
        <input type="range" id="angSlider" min="0" max="180" value="0">

    <button id="angleToggleBtn" class="angle-btn">
    <svg width="20" height="20" viewBox="0 0 20 20">
        <!-- 0° -->
        <line x1="2" y1="14" x2="18" y2="14" stroke="currentColor" stroke-width="1" stroke-linecap="round" />
        <!-- 45° -->
        <line x1="10" y1="14" x2="16" y2="8" stroke="currentColor" stroke-width="1" stroke-linecap="round" />
        <!-- 90° -->
        <line x1="10" y1="14" x2="10" y2="6" stroke="currentColor" stroke-width="1" stroke-linecap="round" />
        <!-- 135° -->
        <line x1="10" y1="14" x2="4" y2="8" stroke="currentColor" stroke-width="1" stroke-linecap="round" />
    </svg>
    </button>

    <!--button id="generateBtn">生成</button-->
    <button id="processBtn">加工する</button>
    <button id="resetBtn">リセット</button>
    <button id="deleteToolBtn">ヘラを消す</button>
    <input id="modelNameInput" type="text" placeholder="モデル名" style="width:80px;">
    <button id="saveBtn">保存</button>
    <input id="loadFileInput" type="file" accept=".json">

    <label>
    <input type="checkbox" id="showSection" checked>
    断面表示
    </label>


</div>

</body>

<!-- Three.js 読み込み -->
<script type="module">
import * as THREE from "https://esm.sh/three@0.152.2";
import { OrbitControls } from "https://esm.sh/three@0.152.2/examples/jsm/controls/OrbitControls.js";
/* ============================
   左：2D XZ Canvas
============================ */

const canvas = document.getElementById("xzCanvas");
const ctx = canvas.getContext("2d");
const CANVAS_ZOOM_SCALE = 0.8;

function resizeCanvas() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let profilePoints = [];
let R = Number(document.getElementById("radiusSlider").value);

document.getElementById("radiusSlider").addEventListener("input", (e) => {
    const newR = Number(e.target.value);

    // ★ 未加工ヘラだけ半径を更新する
    profilePoints.forEach(p => {
        if (!p.processed) {
            p.R = newR;
        }
    });

    R = newR;  // グローバル R も更新しておく（新規ヘラ追加用）

    // Canvas描画（断面図切替付き）
    drawCanvasAll();
});

canvas.addEventListener("wheel", (e) => {
    // Ctrlキーを押しているときだけ半径変更（誤操作防止）
    /* if (!e.ctrlKey) return; */
    e.preventDefault();   // ページスクロールを止める

    const delta = e.deltaY;

    if (e.shiftKey) {
        // ★ Shift + ホイール → 角度変更
        let A = angle;

        if (delta < 0) {
            A += 2;   // 上回転 → 角度を増やす
        } else {
            A -= 2;   // 下回転 → 角度を減らす
        }

        // 角度の範囲（必要なら調整）
        A = Math.max(0, Math.min(A, 180));

        angle = A;

        // スライダーにも反映
        const slider = document.getElementById("angSlider");
        slider.value = A;

    } else if (e.altKey) {
        // ★ Alt + ホイール → 角度変更
        const sliderR = document.getElementById("radiusSlider");
        R = parseInt(sliderR.value);

        // ホイール方向で増減
        if (e.deltaY < 0) {
            R += 1; // 上スクロール → 半径を大きく
        } else {
            R -= 1; // 下スクロール → 半径を小さく
        }

        // 範囲内に収める
        R = Math.max(parseInt(sliderR.min), Math.min(parseInt(sliderR.max), R));

        sliderR.value = R;

    } else {
        // ★ 通常ホイール → 長さ変更（既存の動作）
        let L = length;

        if (delta < 0) {
            L += 1;
        } else {
            L -= 1;
        }

        L = Math.max(0, Math.min(L, 200));
        length = L;

        const slider = document.getElementById("lenSlider");
        slider.value = L;
    }

    drawCanvasAll();
}, { passive: false });


function getXZFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const z = e.clientY - rect.top;
    return { x, z };
}
//-------------------------S
// 標準的な voxel 変換
function idToXYZ(octantId, length) {
    let x = 0, y = 0, z = 0;
    let size = length;

    for (const c of octantId) {
        size /= 2;  // 階層が深くなるほど voxel が小さくなる

        switch (c) {
            case "A": x += size/2; y += size/2; z += size/2; break;
            case "B": x -= size/2; y += size/2; z += size/2; break;
            case "C": x -= size/2; y -= size/2; z += size/2; break;
            case "D": x += size/2; y -= size/2; z += size/2; break;
            case "E": x += size/2; y += size/2; z -= size/2; break;
            case "F": x -= size/2; y += size/2; z -= size/2; break;
            case "G": x -= size/2; y -= size/2; z -= size/2; break;
            case "H": x += size/2; y -= size/2; z -= size/2; break;
        }
    }

    return { x, y, z };
}

function drawCapsuleEnd(x0, z0, x1, z1, R) {

    // canvas の Z 軸反転補正
    const dx = x1 - x0;
    const dz = -(z1 - z0);  // ★ Z反転補正

    // 軸線の角度（数学座標系）
    let angle = Math.atan2(dz, dx);

    // ★ canvas の向きに合わせて 90°補正
    angle += Math.PI / 2;

    ctx.beginPath();

    // ★ 円弧の向きを正しくする（開始と終了の順序が重要）
    ctx.arc(x0, z0, R, angle + Math.PI/2, angle - Math.PI/2);

    ctx.stroke();
}

function clayToCanvas(x_clay, z_clay) {
    const canvas = document.getElementById("xzCanvas");
    const w = canvas.width;
    const h = canvas.height;

    const scale = Math.min(w, h) * CANVAS_ZOOM_SCALE / model.L;
    const cx = w / 2;
    const cz = h / 2;

    // ★ clay座標は 0〜L の実座標なのでそのまま使う
    const x_canvas = cx + x_clay * scale;
    const z_canvas = cz - z_clay * scale;

    return { x: x_canvas, z: z_canvas };
}

function drawCapsuleOnCanvas(ctx, P0, P1, R_canvas, color="rgba(0,120,255,0.8)") {

    ctx.strokeStyle = color;
    ctx.lineWidth = 2;

    // 円（左）
    ctx.beginPath();
    ctx.arc(P0.x, P0.z, R_canvas, 0, Math.PI * 2);
    ctx.stroke();

    // 円（右）
    ctx.beginPath();
    ctx.arc(P1.x, P1.z, R_canvas, 0, Math.PI * 2);
    ctx.stroke();

    // 接線 2 本
    const dx = P1.x - P0.x;
    const dz = P1.z - P0.z;
    const len = Math.sqrt(dx*dx + dz*dz);

    const nx = -dz / len;
    const nz =  dx / len;

    const left_top_x = P0.x + nx * R_canvas;
    const left_top_z = P0.z + nz * R_canvas;

    const left_bottom_x = P0.x - nx * R_canvas;
    const left_bottom_z = P0.z - nz * R_canvas;

    const right_top_x = P1.x + nx * R_canvas;
    const right_top_z = P1.z + nz * R_canvas;

    const right_bottom_x = P1.x - nx * R_canvas;
    const right_bottom_z = P1.z - nz * R_canvas;

    // 上側接線
    ctx.beginPath();
    ctx.moveTo(left_top_x, left_top_z);
    ctx.lineTo(right_top_x, right_top_z);
    ctx.stroke();

    // 下側接線
    ctx.beginPath();
    ctx.moveTo(left_bottom_x, left_bottom_z);
    ctx.lineTo(right_bottom_x, right_bottom_z);
    ctx.stroke();
}

function updateSectionView() {

    const canvas = document.getElementById("xzCanvas");
    const ctx = canvas.getContext("2d");

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const w = canvas.width;
    const h = canvas.height;

    const L = model.L;
    const scale = Math.min(w, h) * CANVAS_ZOOM_SCALE / L;

    const offsetX = w / 2;
    const offsetZ = h / 2;
    // -------------------------
    // ③ 断面を描く（塗りつぶし）
    // -------------------------
    ctx.fillStyle = "#88c";

    for (const id of model.ids) {

        const { x, y, z } = idToXYZ(id, model.L);
        const depth = id.length;
        const size = model.L / Math.pow(2, depth);

        const yMin = y - size/2;
        const yMax = y + size/2;

        const eps = 1e-7;

        if (yMin <= eps && yMax >= -eps) {

            const x0 = x - size/2;
            const x1 = x + size/2;
            const z0 = z - size/2;
            const z1 = z + size/2;

            const px0 = offsetX + x0 * scale;
            const px1 = offsetX + x1 * scale;
            const pz0 = offsetZ - z0 * scale;
            const pz1 = offsetZ - z1 * scale;

            ctx.fillRect(px0, pz1, px1 - px0, pz0 - pz1);
        }
    }
    // -------------------------
    // ① グリッドを描く
    // -------------------------
    ctx.strokeStyle = "#ccc";
    ctx.lineWidth = 1;

    const cx = canvas.width / 2;
    const cz = canvas.height / 2;

    // 縦線（X方向）
    for (let gx = cx; gx < canvas.width; gx += 50) {
        ctx.beginPath();
        ctx.moveTo(gx, 0);
        ctx.lineTo(gx, canvas.height);
        ctx.stroke();
    }
    for (let gx = cx; gx > 0; gx -= 50) {
        ctx.beginPath();
        ctx.moveTo(gx, 0);
        ctx.lineTo(gx, canvas.height);
        ctx.stroke();
    }

    // 横線（Z方向）
    for (let gz = cz; gz < canvas.height; gz += 50) {
        ctx.beginPath();
        ctx.moveTo(0, gz);
        ctx.lineTo(canvas.width, gz);
        ctx.stroke();
    }
    for (let gz = cz; gz > 0; gz -= 50) {
        ctx.beginPath();
        ctx.moveTo(0, gz);
        ctx.lineTo(canvas.width, gz);
        ctx.stroke();
    }

    // -------------------------
    // ② 軸を描く
    // -------------------------

    // ★ 赤い軸線（復活）
    ctx.strokeStyle = "#ff4444";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, canvas.height / 2);
    ctx.lineTo(canvas.width, canvas.height / 2);
    ctx.stroke();

    drawClaySquare();

    // 以下はヘラ描画（そのまま）
    ctx.strokeStyle = "#0077ff";
    ctx.lineWidth = 2;

    for (const p of profilePoints) {

        // 断面上のヘラ軸（P0,P1）を生成
        const { P0, P1 } = capsuleEndpoints(p.x, p.z, p.length, p.angle);

        // canvas 座標に変換
        const cP0 = clayToCanvas(P0.x, P0.z);
        const cP1 = clayToCanvas(P1.x, P1.z);

        // 半径を canvas スケールに変換
        const scale = Math.min(canvas.width, canvas.height) * CANVAS_ZOOM_SCALE / model.L;
        const R_canvas = p.R * scale;

        ctx.strokeStyle = "#0077ff";
        // ★ 加工済みならグレー、未加工なら青
        const color = p.processed ? "#999" : "#0077ff";
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;

         if (p.length === 0) {
            // 球ヘラ（len=0）は円として描く
            ctx.beginPath();
            ctx.arc(cP0.x, cP0.z, R_canvas, 0, Math.PI * 2);
            ctx.stroke();
        } else {
            // カプセル形状（端点は円で描く）
            drawCapsuleOnCanvas(ctx, cP0, cP1, R_canvas, color);

        }
    }

    // === 回転軸（センターライン） ===
    ctx.strokeStyle = "#ff4444";   // 目立つ赤
    ctx.lineWidth = 2;

    // 縦のセンターライン（回転軸）
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.stroke();

    // 横のセンターライン（高さの基準）
    ctx.beginPath();
    ctx.moveTo(0, canvas.height / 2);
    ctx.lineTo(canvas.width, canvas.height / 2);
    ctx.stroke();

    // === ヘラのプレビュー表示 ===
    if (previewPos) {

        const R_prev = Number(document.getElementById("radiusSlider").value);
        const len_prev = Number(document.getElementById("lenSlider").value);
        const ang_prev = Number(document.getElementById("angSlider").value);

        const scale = Math.min(canvas.width, canvas.height) * CANVAS_ZOOM_SCALE / L;
        const R_canvas_prev = R_prev * scale;

        // ★ previewPos は clay座標なのでそのまま使える
        const { P0, P1 } = capsuleEndpoints(previewPos.x, previewPos.z, len_prev, ang_prev);

        // canvas座標へ変換
        const cP0 = clayToCanvas(P0.x, P0.z);
        const cP1 = clayToCanvas(P1.x, P1.z);

        ctx.strokeStyle = "rgba(0, 120, 255, 0.3)";
        ctx.lineWidth = 2;

        if (len_prev === 0) {
            // 球ヘラ
            ctx.beginPath();
            ctx.arc(cP0.x, cP0.z, R_canvas_prev, 0, Math.PI * 2);
            ctx.stroke();
        } else {
            // === カプセル断面（円＋接線 2 本） ===
            drawCapsuleOnCanvas(ctx, cP0, cP1, R_canvas_prev, "rgba(0,120,255,0.3)");

        }
    }

    console.log("断面＋グリッド＋軸 表示完了");
}


//-------------------------E

document.getElementById("radiusSlider").addEventListener("input", () => {
    const newR = Number(radiusSlider.value);

    // 未加工ヘラだけ半径を更新
    profilePoints.forEach(p => {
        if (!p.processed) {
            p.R = newR;
        }
    });

    R = newR;
    // Canvas描画（断面図切替付き）
    drawCanvasAll();
    generate3D();
});

canvas.addEventListener("click", (e) => {

    const p_canvas = getXZFromEvent(e);

    const p_clay = canvasToClay(p_canvas.x, p_canvas.z);

    profilePoints.push({
        x: p_clay.x,     // ★ clay座標で保存
        z: p_clay.z,     // ★ clay座標で保存
        R: R,
        length: length,
        angle: angle,
        processed: false
    });


    // Canvas描画（断面図切替付き）
    drawCanvasAll();
    generate3D();

    previewPos = null;
});

const L = 25.6;

function drawClaySquare() {
    const w = canvas.width;
    const h = canvas.height;

    const cx = w / 2;
    const cz = h / 2;

    const scale = Math.min(w, h) * CANVAS_ZOOM_SCALE / L;
    const half = (L / 2) * scale;

    ctx.strokeStyle = "#888";
    ctx.lineWidth = 2;

    ctx.strokeRect(cx - half, cz - half, half * 2, half * 2);
}

function draw() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // === 原点中心グリッド ===
    ctx.strokeStyle = "#ddd";
    ctx.lineWidth = 1;

    const cx = canvas.width / 2;
    const cz = canvas.height / 2;

    // 縦線（X方向）
    for (let gx = cx; gx < canvas.width; gx += 50) {
        ctx.beginPath();
        ctx.moveTo(gx, 0);
        ctx.lineTo(gx, canvas.height);
        ctx.stroke();
    }
    for (let gx = cx; gx > 0; gx -= 50) {
        ctx.beginPath();
        ctx.moveTo(gx, 0);
        ctx.lineTo(gx, canvas.height);
        ctx.stroke();
    }

    // 横線（Z方向）
    for (let gz = cz; gz < canvas.height; gz += 50) {
        ctx.beginPath();
        ctx.moveTo(0, gz);
        ctx.lineTo(canvas.width, gz);
        ctx.stroke();
    }
    for (let gz = cz; gz > 0; gz -= 50) {
        ctx.beginPath();
        ctx.moveTo(0, gz);
        ctx.lineTo(canvas.width, gz);
        ctx.stroke();
    }

    // ★ 赤い軸線
    ctx.strokeStyle = "#ff4444";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, canvas.height / 2);
    ctx.lineTo(canvas.width, canvas.height / 2);
    ctx.stroke();

    drawClaySquare();

    // === ヘラ描画（カプセル断面に統一） ===
    const w = canvas.width;
    const h = canvas.height;
    const scale = Math.min(w, h) * CANVAS_ZOOM_SCALE / L;

    for (const p of profilePoints) {

        const { P0, P1 } = capsuleEndpoints(p.x, p.z, p.length, p.angle);

        const cP0 = clayToCanvas(P0.x, P0.z);
        const cP1 = clayToCanvas(P1.x, P1.z);

        const R_canvas = p.R * scale;

        ctx.strokeStyle = p.processed ? "#999" : "#0077ff";

        if (p.length === 0) {
            // 球ヘラ
            ctx.beginPath();
            ctx.arc(cP0.x, cP0.z, R_canvas, 0, Math.PI * 2);
            ctx.stroke();
        } else {
            // カプセル断面
            drawCapsuleOnCanvas(ctx, cP0, cP1, R_canvas, ctx.strokeStyle);
        }
    }

    // === プレビュー（カプセル断面に統一） ===
    if (previewPos) {

        const R_prev = Number(document.getElementById("radiusSlider").value);
        const len_prev = Number(document.getElementById("lenSlider").value);
        const ang_prev = Number(document.getElementById("angSlider").value);

        const R_canvas_prev = R_prev * scale;

        const { P0, P1 } = capsuleEndpoints(previewPos.x, previewPos.z, len_prev, ang_prev);

        const cP0 = clayToCanvas(P0.x, P0.z);
        const cP1 = clayToCanvas(P1.x, P1.z);

        ctx.strokeStyle = "rgba(0, 120, 255, 0.3)";

        if (len_prev === 0) {
            ctx.beginPath();
            ctx.arc(cP0.x, cP0.z, R_canvas_prev, 0, Math.PI * 2);
            ctx.stroke();
        } else {
            drawCapsuleOnCanvas(ctx, cP0, cP1, R_canvas_prev, ctx.strokeStyle);
        }
    }
}

const angleSteps = [0, 45, 90, 135];
let angleIndex = 0;

const angleBtn = document.getElementById("angleToggleBtn");

angleBtn.addEventListener("click", () => {
    angleIndex = (angleIndex + 1) % angleSteps.length;
    const a = angleSteps[angleIndex];

    // スライダーに反映
    const slider = document.getElementById("angSlider");
    slider.value = a;

    // 内部状態に反映
    angle = a;

    drawCanvasAll();

});

/* ============================
   右：Three.js 3D 粘土ビュー
============================ */

function init_model(size){
    return {
        L: size,
        ids: ["A","B","C","D","E","F","G","H"]
    };
}
/* ============================
  Canvasから粘土への対応
*/
function canvasToClay(x_canvas, z_canvas) {
    const w = canvas.width;
    const h = canvas.height;

    const cx = w / 2;
    const cz = h / 2;

    const scale = Math.min(w, h) * CANVAS_ZOOM_SCALE / L;

    const x_clay = (x_canvas - cx) / scale;

    // ★ Canvas の z は下が正 → Three.js の z は上が正
    const z_clay = -(z_canvas - cz) / scale;

    return { x: x_clay, z: z_clay };
}


function generateRotationalPoints(p, steps) {
    const pts = [];
    for (let i = 0; i < steps; i++) {
        const theta = (i / steps) * Math.PI * 2;
        const x = p.x * Math.cos(theta);
        const y = p.x * Math.sin(theta);  // y 軸まわりの回転
        const z = p.z;
        pts.push({ x, y, z });
    }
    return pts;
}

function generateRotationalPairPoints(p1, p2, steps) {
    const pts = [];
    for (let i = 0; i < steps; i++) {
        const theta = (i / steps) * Math.PI * 2;
        const x1 = p1.x * Math.cos(theta);
        const y1 = p1.x * Math.sin(theta);  // y 軸まわりの回転
        const z1 = p1.z;
        const x2 = p2.x * Math.cos(theta);
        const y2 = p2.x * Math.sin(theta);  // y 軸まわりの回転
        const z2 = p2.z;
        pts.push([{ x: x1, y: y1, z: z1 }, { x: x2, y: y2, z: z2 }]);
    }
    return pts;
}

function carveSphereAtPoints(points, radius) {
    // 今は「削った位置に赤い球を置く」だけ
    points.forEach(pt => {
        const geo = new THREE.SphereGeometry(radius, 16, 16);
        const mat = new THREE.MeshPhongMaterial({ color: 0xff4444 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(pt.x, pt.y, pt.z);
        scene.add(mesh);
    });
}
//---
// Octant → center + size
function octantCenter(id, L) {
  let x = 0, y = 0, z = 0;
  let size = L;

  for (const c of id) {
    size /= 2;
    const h = size / 2;

    switch (c) {
      case "A": x += h; y += h; z += h; break;
      case "B": x -= h; y += h; z += h; break;
      case "C": x -= h; y -= h; z += h; break;
      case "D": x += h; y -= h; z += h; break;
      case "E": x += h; y += h; z -= h; break;
      case "F": x -= h; y += h; z -= h; break;
      case "G": x -= h; y -= h; z -= h; break;
      case "H": x += h; y -= h; z -= h; break;
    }
  }

  return { x, y, z, size };
}

// cube の 8つの頂点を返す
function cubeCorners(cx, cy, cz, size) {
    const h = size / 2;

    return [
        [cx - h, cy - h, cz - h],
        [cx + h, cy - h, cz - h],
        [cx + h, cy + h, cz - h],
        [cx - h, cy + h, cz - h],
        [cx - h, cy - h, cz + h],
        [cx + h, cy - h, cz + h],
        [cx + h, cy + h, cz + h],
        [cx - h, cy + h, cz + h]
    ];
}

// 球の内部判定
function insideSphere(x, y, z, cx, cy, cz, R) {
  const dx = x - cx;
  const dy = y - cy;
  const dz = z - cz;
  return (dx*dx + dy*dy + dz*dz) <= R*R;
}

// 球と cube の干渉判定
function intersectsSphereCube(sphereCenter, R, cx, cy, cz, size) {
    const h = size / 2;

    // cube の範囲
    const minX = cx - h;
    const maxX = cx + h;
    const minY = cy - h;
    const maxY = cy + h;
    const minZ = cz - h;
    const maxZ = cz + h;

    // 球の中心
    const sx = sphereCenter.x;
    const sy = sphereCenter.y;
    const sz = sphereCenter.z;

    // 球中心から cube に最も近い点を求める
    const px = Math.max(minX, Math.min(sx, maxX));
    const py = Math.max(minY, Math.min(sy, maxY));
    const pz = Math.max(minZ, Math.min(sz, maxZ));

    // 距離判定
    const dx = px - sx;
    const dy = py - sy;
    const dz = pz - sz;

    return (dx*dx + dy*dy + dz*dz) <= R*R;
}

// 親IDから8つの子IDを生成する（Octree）
function generateChildren(id) {
    return [
        id + "A",
        id + "B",
        id + "C",
        id + "D",
        id + "E",
        id + "F",
        id + "G",
        id + "H"
    ];
}

function carveSphere(id, L, sphereCenter, R, maxDepth) {
    const { x, y, z, size } = octantCenter(id, L);

    // cube の 8頂点を求める
    const corners = cubeCorners(x, y, z, size);

    // 完全内包チェック
    let allInside = true;
    for (const p of corners) {
        if (!insideSphere(p, sphereCenter, R)) {
            allInside = false;
            break;
        }
    }
    if (allInside) {
        return []; // 削除
    }

    // 完全外チェック
    if (!intersectsSphereCube(sphereCenter, R, x, y, z, size)) {
        return [id]; // そのまま残す
    }

    // 部分交差 → 細分化
    if (id.length >= maxDepth) {
        // これ以上細分化できない → 最小 cube
        return []; // 削る
    }

    // 子 cube を生成
    const children = generateChildren(id);

    // 子 cube を再判定
    let result = [];
    for (const child of children) {
        result.push(...carveSphere(child, L, sphereCenter, R, maxDepth));
    }
    return result;
}

function cut_sphere(ids_current, L, sphereCenter, R){
    const maxDepth = 8;
    let new_ids = [];

    for (const id of ids_current) {
        const result = carveSphere(id, L, sphereCenter, R, maxDepth);
        new_ids.push(...result);
    }

    ids_current = new_ids;
    return ids_current;
}
//-- カプセルヘラ実装 S
function distanceSquared(a, b) {
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    const dz = a.z - b.z;
    return dx*dx + dy*dy + dz*dz;
}

function closestPointOnSegment(P0, P1, C) {
    // 球ヘラモード（P0 = P1）のとき
    if (P0.x === P1.x && P0.y === P1.y && P0.z === P1.z) {
        return P0;  // 最近点は中心そのもの
    }

    const vx = P1.x - P0.x;
    const vy = P1.y - P0.y;
    const vz = P1.z - P0.z;

    const wx = C.x - P0.x;
    const wy = C.y - P0.y;
    const wz = C.z - P0.z;

    const vv = vx*vx + vy*vy + vz*vz;
    const t = Math.max(0, Math.min(1, (wx*vx + wy*vy + wz*vz) / vv));

    return {
        x: P0.x + t * vx,
        y: P0.y + t * vy,
        z: P0.z + t * vz
    };
}

function insideCapsule(p, P0, P1, R) {
    const closest = closestPointOnSegment(P0, P1, p);
    return distanceSquared(p, closest) <= R*R;
}

function intersectsCapsule(P0, P1, R, C, size) {

    const closest = closestPointOnSegment(P0, P1, C);
    const d2 = distanceSquared(C, closest);

    const h = size / 2;
    const cubeRadius = Math.sqrt(3 * h * h);

    return d2 <= (R + cubeRadius) * (R + cubeRadius);
}

//カプセル形状で削る。
function carveCapsule(id, L, P0, P1, R, maxDepth) {
    const { x, y, z, size } = octantCenter(id, L);
    const C = { x, y, z };

    // 完全外
    if (!intersectsCapsule(P0, P1, R, C, size)) {
        return [id];
    }

    // 完全内包
    const corners = cubeCorners(x, y, z, size);
    let allInside = true;
    for (const p of corners) {
        if (!insideCapsule(p, P0, P1, R)) {
            allInside = false;
            break;
        }
    }
    if (allInside) {
        return [];
    }

    // 部分交差 → 細分化
    if (id.length >= maxDepth) {
        return [];
    }

    const children = generateChildren(id);
    let result = [];
    for (const child of children) {
        result.push(...carveCapsule(child, L, P0, P1, R, maxDepth));
    }
    return result;
}
// 中心点、長さ、angleから、円柱端点を算出する。
function capsuleEndpoints(cx, cy, len, angle) {
    // 角度をラジアンに変換
    const rad = angle * Math.PI / 180;

    // XZ 平面での方向ベクトル
    const dx = Math.cos(rad);
    const dz = Math.sin(rad);

    // 正規化（念のため）
    const mag = Math.sqrt(dx*dx + dz*dz);
    const nx = dx / mag;
    const nz = dz / mag;

    // 円柱部分の半分の長さ
    const half = len / 2;

    // P0, P1 を計算
    const P0 = { x: cx - nx * half, y: 0, z: cy - nz * half };
    const P1 = { x: cx + nx * half, y: 0, z: cy + nz * half };

    return { P0, P1 };
}

function cut_capsule(ids_current, L, P0, P1, R){
    const maxDepth = 8;
    let new_ids = [];

    for (const id of ids_current) {
        const result = carveCapsule(id, L, P0, P1, R, maxDepth);
        new_ids.push(...result);
    }

    return new_ids;
}

//--カプセルヘラ実装 E

function classifyCell(cell) {
    const count = cell.points.length;

    if (count === 0) return "empty";
    if (count === cell.capacity) return "filled";
    return "mixed";  // 境界セル
}

function renderOctree(cell) {
    const type = classifyCell(cell);

    if (type === "mixed") {
        const geometry = new THREE.BoxGeometry(cell.size, cell.size, cell.size);
        const mesh = new THREE.Mesh(geometry, clayMaterial);

        // ★ 位置をセット（必須）
        mesh.position.set(cell.x, cell.y, cell.z);

        // ★ add は 1 回だけ
        scene.add(mesh);
    }

    if (cell.children) {
        for (const child of cell.children) {
            renderOctree(child);
        }
    }
}

let clayGroup = null;
let traceGroup = null;
let previewPos = null;

function deleteActiveTool() {
    // ★ profilePoints の最後のヘラが active
    if (profilePoints.length > 0) {
        profilePoints.pop();
    }
}

function deleteActiveToolsAndRefresh(){
    deleteActiveTool();

    // ★ traceGroup を完全に消す
    if (traceGroup) {

    /* draw(); */

function generate3D(){

    const steps = Number(document.getElementById("rotSlider").value);

    if (traceGroup) {
        scene.remove(traceGroup);
        traceGroup = null;
    }

    traceGroup = new THREE.Group();

    profilePoints.forEach(p => {
        if (p.processed) return;

        // ★ p.x, p.z はすでに clay座標
        const clayPos = { x: p.x, z: p.z };

        const { P0, P1 } = capsuleEndpoints(clayPos.x, clayPos.z, p.length, p.angle);
        const pts3d = generateRotationalPairPoints(P0, P1, steps);

        pts3d.forEach(pt => {
            const geo = new THREE.SphereGeometry(p.R, 16, 16);
            const mat = new THREE.MeshPhongMaterial({ color: 0xff4444 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(pt[0].x, pt[0].y, pt[0].z);
            traceGroup.add(mesh);
            const mesh2 = new THREE.Mesh(geo, mat);
            mesh2.position.set(pt[1].x, pt[1].y, pt[1].z);
            traceGroup.add(mesh2);

            // --- cylinder（軸線） ---
            const dx = pt[1].x - pt[0].x;
            const dy = pt[1].y - pt[0].y;
            const dz = pt[1].z - pt[0].z;
            const len = Math.sqrt(dx*dx + dy*dy + dz*dz);

            const mx = (pt[0].x + pt[1].x) / 2;
            const my = (pt[0].y + pt[1].y) / 2;
            const mz = (pt[0].z + pt[1].z) / 2;

            const dir = new THREE.Vector3(dx, dy, dz).normalize();
            const axis = new THREE.Vector3(0, 1, 0);
            const quaternion = new THREE.Quaternion().setFromUnitVectors(axis, dir);

            const geoCyl = new THREE.CylinderGeometry(p.R, p.R, len, 16);
            const cyl = new THREE.Mesh(geoCyl, mat);
            cyl.position.set(mx, my, mz);
            cyl.quaternion.copy(quaternion);

            traceGroup.add(cyl);
        });
    });

    if (traceGroup.children.length === 0) {
        traceGroup = null;
        return;
    }

    scene.add(traceGroup);
}

//加工処理
function processClay(){
    if (traceGroup) {
        scene.remove(traceGroup);
        traceGroup = null;
    }

    const steps = Number(document.getElementById("rotSlider").value);
    let ids_current = model.ids;

    profilePoints.forEach(p => {
        if (p.processed) return;

        // ★ p.x, p.z はすでに clay座標
        const clayPos = { x: p.x, z: p.z };

        const { P0, P1 } = capsuleEndpoints(clayPos.x, clayPos.z, p.length, p.angle);
        const pts3d = generateRotationalPairPoints(P0, P1, steps);

        pts3d.forEach(pt => {
            ids_current = cut_capsule(ids_current, model.L, pt[0], pt[1], p.R);
        });

        p.processed = true;
    });

    model.ids = ids_current;
    redrawClayFromIDs(model.ids);
    drawCanvasAll();
}

function redrawClayFromIDs(ids) {

    if (clayGroup) scene.remove(clayGroup);

    const geo = new THREE.BoxGeometry(1, 1, 1);
    const mat = new THREE.MeshPhongMaterial({ color: 0xcccccc });

    const mesh = new THREE.InstancedMesh(geo, mat, ids.length);
    const dummy = new THREE.Object3D();

    ids.forEach((id, i) => {
        const { x, y, z, size } = octantCenter(id, model.L);

        dummy.position.set(x, y, z);
        dummy.scale.set(size, size, size);
        dummy.updateMatrix();

        mesh.setMatrixAt(i, dummy.matrix);
    });

    mesh.instanceMatrix.needsUpdate = true;

    clayGroup = mesh;
    scene.add(clayGroup);
}

const model = init_model(L);

function getTimestampFilename(model_name="myclay") {
    const d = new Date();

    const yyyy = d.getFullYear();
    const mm   = String(d.getMonth() + 1).padStart(2, '0');
    const dd   = String(d.getDate()).padStart(2, '0');

    const hh   = String(d.getHours()).padStart(2, '0');
    const mi   = String(d.getMinutes()).padStart(2, '0');
    const ss   = String(d.getSeconds()).padStart(2, '0');

    return `${model_name}-${yyyy}${mm}${dd}-${hh}${mi}${ss}.json`;
}

function saveClayModel() {
    const name = document.getElementById("modelNameInput").value;

    if (name.includes("-")) {
        alert("モデル名にハイフン（-）は使えません。別の名前を入力してください。");
        return;  // 保存処理を中断
    }

    const input = document.getElementById("modelNameInput").value.trim();
    const model_name = input === "" ? "myclay" : input;

    const filename = getTimestampFilename(model_name);

    const json = JSON.stringify(model, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = filename;   // ★ ユーザー指定名＋時刻
    a.click();

    URL.revokeObjectURL(url);
}

function resetModel() {

    // 粘土モデルの初期化
    const ini_model = init_model(L);
    model.L = ini_model.L;
    model.ids = ini_model.ids;

    // 加工ストロークの初期化
    profilePoints = [];

    // 3D の削除
    if (clayGroup) scene.remove(clayGroup);
    if (traceGroup) scene.remove(traceGroup);

    clayGroup = null;
    traceGroup = null;

    // 初期粘土を生成
    createClayCube(model.L);
    // Canvas 初期化
    drawCanvasAll();

    document.getElementById("modelNameInput").value = "";
}

function loadClayModel(file) {
    const reader = new FileReader();

    reader.onload = (event) => {
        try {
            const data = JSON.parse(event.target.result);

            // ★ ファイル名からモデル名を抽出
            const filename = file.name;  // 例: myclay-20260911-152233.json
            // ★ まず .json を削除
            const noExt = filename.replace(/\.json$/i, "");

            const modelName = noExt.includes("-")
                ? noExt.split("-")[0]
                : noExt;

            // ★ input にセット
            document.getElementById("modelNameInput").value = modelName;

            // ★ 保存データは L と ids のみ
            model.L = data.L;
            model.ids = data.ids;

            // ★ profilePoints は空で初期化
            profilePoints = [];

            // ★ 古い 3D を消す（重要）
            if (traceGroup) {
                scene.remove(traceGroup);
            }

            if (clayGroup) {
                scene.remove(clayGroup);
            }

            redrawClayFromIDs(model.ids);

            // ★ 新しい 3D を生成
            generate3D();

            // Canvas描画（断面図切替付き）
            drawCanvasAll();

        } catch (err) {
            alert("JSON の読み込みに失敗しました");
            console.error(err);
        }
    };

    reader.readAsText(file);
}
