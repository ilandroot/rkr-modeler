<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Rotational Clay Modeler</title>

<style>
    body {
        margin: 0;
        background: #f0f0f0;
        font-family: sans-serif;
    }

    /* 上段：2D + 3D の2画面 */
    #container {
        display: flex;
        height: 70vh;
        border-bottom: 2px solid #ccc;
    }

    /* 左：2D XZ 断面ビュー */
    #view2d {
        flex: 1;
        background: #ffffff;
        border-right: 2px solid #ccc;
        position: relative;
    }

#xzCanvas {
    width: 100%;
    height: 100%;
    background: #fafafa;
    cursor: url('data:image/svg+xml;utf8,\
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32">\
<line x1="16" y1="0" x2="16" y2="32" stroke="white" stroke-width="4"/>\
<line x1="0" y1="16" x2="32" y2="16" stroke="white" stroke-width="4"/>\
<line x1="16" y1="0" x2="16" y2="32" stroke="black" stroke-width="2"/>\
<line x1="0" y1="16" x2="32" y2="16" stroke="black" stroke-width="2"/>\
</svg>') 16 16, crosshair;

}

    /* 右：3D 粘土ビュー */
    #view3d {
        flex: 1;
        background: #000;
        position: relative;
    }

    #threeContainer {
        width: 100%;
        height: 100%;
    }

    /* 下段：操作パネル */
    #controls {
        height: 30vh;
        padding: 10px;
        background: #ffffff;
        display: flex;
        align-items: center;
        gap: 20px;
        border-top: 2px solid #ccc;
    }

    .control-group {
        display: flex;
        flex-direction: column;
        font-size: 14px;
    }

    button {
        padding: 10px 20px;
        font-size: 16px;
    }
</style>

</head>
<body>

<div id="container">

    <!-- 左：2D XZ 断面ビュー -->
    <div id="view2d">
        <canvas id="xzCanvas"></canvas>
    </div>

    <!-- 右：3D 粘土ビュー -->
    <div id="view3d">
        <div id="threeContainer"></div>
    </div>

</div>

<!-- 下：操作パネル -->
<div id="controls">
    <div class="control-group">
        <label>球ヘラ半径 R</label>
        <input type="range" id="radiusSlider" min="1" max="10" value="4">
    </div>

    <div class="control-group">
        <label>回転分割数 steps_rot</label>
        <input type="range" id="rotSlider" min="10" max="180" value="60">
    </div>

    <div class="control-group">
        <label>断面分割数 steps_profile</label>
        <input type="range" id="profileSlider" min="5" max="100" value="30">
    </div>

    <button id="generateBtn">生成</button>
    <button id="processBtn">加工</button>
    <button id="resetBtn">リセット</button>
</div>

</body>

<!-- Three.js 読み込み -->
<script type="module">
import * as THREE from "https://esm.sh/three@0.152.2";
import { OrbitControls } from "https://esm.sh/three@0.152.2/examples/jsm/controls/OrbitControls.js";
/* ============================
   左：2D XZ Canvas
============================ */

const canvas = document.getElementById("xzCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let profilePoints = [];
let R = Number(document.getElementById("radiusSlider").value);

function getXZFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const z = e.clientY - rect.top;
    return { x, z };
}

canvas.addEventListener("click", (e) => {
    const p = getXZFromEvent(e);

    profilePoints.push({
        x: p.x,
        z: p.z,
        R: R,            // ★ 現在のスライダーの半径を保存
        processed: false // ★ 未加工ヘラ
    });

    draw();
});

document.getElementById("radiusSlider").addEventListener("input", () => {
    const newR = Number(radiusSlider.value);

    // 未加工ヘラだけ半径を更新
    profilePoints.forEach(p => {
        if (!p.processed) {
            p.R = newR;
        }
    });

    R = newR;
    draw();
});

const L = 25.6;

function drawClaySquare() {
    const w = canvas.width;
    const h = canvas.height;

    const cx = w / 2;
    const cz = h / 2;

    const scale = Math.min(w, h) * 0.8 / L;
    const half = (L / 2) * scale;

    ctx.strokeStyle = "#888";
    ctx.lineWidth = 2;

    ctx.strokeRect(cx - half, cz - half, half * 2, half * 2);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "#ddd";
    for (let gx = 0; gx < canvas.width; gx += 50) {
        ctx.beginPath();
        ctx.moveTo(gx, 0);
        ctx.lineTo(gx, canvas.height);
        ctx.stroke();
    }
    for (let gz = 0; gz < canvas.height; gz += 50) {
        ctx.beginPath();
        ctx.moveTo(0, gz);
        ctx.lineTo(canvas.width, gz);
        ctx.stroke();
    }

    drawClaySquare();

    ctx.strokeStyle = "#0077ff";
    ctx.lineWidth = 2;

    for (const p of profilePoints) {
        ctx.beginPath();

        const w = canvas.width;
        const h = canvas.height;

        if (p.processed) {
            ctx.strokeStyle = "#999";   // グレー
        } else {
            ctx.strokeStyle = "#0077ff"; // 青
        }
        const scale = Math.min(w, h) * 0.8 / L;
        const R_canvas = p.R * scale;
        ctx.arc(p.x, p.z, R_canvas, 0, Math.PI * 2);
        ctx.stroke();
    }

}

draw();

/* ============================
   右：Three.js 3D 粘土ビュー
============================ */

function init_model(size = 25.6){
    return {
        L: size,
        ids: ["A","B","C","D","E","F","G","H"]
    };
}
/* ============================
  Canvasから粘土への対応
*/
function canvasToClay(x_canvas, z_canvas) {
    const w = canvas.width;
    const h = canvas.height;

    const cx = w / 2;
    const cz = h / 2;

    const scale = Math.min(w, h) * 0.8 / L;

    const x_clay = (x_canvas - cx) / scale;

    // ★ Canvas の z は下が正 → Three.js の z は上が正
    const z_clay = -(z_canvas - cz) / scale;

    return { x: x_clay, z: z_clay };
}

function generateRotationalPoints(p, steps) {
    const pts = [];
    for (let i = 0; i < steps; i++) {
        const theta = (i / steps) * Math.PI * 2;
        const x = p.x * Math.cos(theta);
        const y = p.x * Math.sin(theta);  // y 軸まわりの回転
        const z = p.z;
        pts.push({ x, y, z });
    }
    return pts;
}

function carveSphereAtPoints(points, radius) {
    // 今は「削った位置に赤い球を置く」だけ
    points.forEach(pt => {
        const geo = new THREE.SphereGeometry(radius, 16, 16);
        const mat = new THREE.MeshPhongMaterial({ color: 0xff4444 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(pt.x, pt.y, pt.z);
        scene.add(mesh);
    });
}
//---
// Octant → center + size
function octantCenter(id, L) {
  let x = 0, y = 0, z = 0;
  let size = L;

  for (const c of id) {
    size /= 2;
    const h = size / 2;

    switch (c) {
      case "A": x += h; y += h; z += h; break;
      case "B": x -= h; y += h; z += h; break;
      case "C": x -= h; y -= h; z += h; break;
      case "D": x += h; y -= h; z += h; break;
      case "E": x += h; y += h; z -= h; break;
      case "F": x -= h; y += h; z -= h; break;
      case "G": x -= h; y -= h; z -= h; break;
      case "H": x += h; y -= h; z -= h; break;
    }
  }

  return { x, y, z, size };
}

// cube の 8つの頂点を返す
function cubeCorners(cx, cy, cz, size) {
    const h = size / 2;

    return [
        [cx - h, cy - h, cz - h],
        [cx + h, cy - h, cz - h],
        [cx + h, cy + h, cz - h],
        [cx - h, cy + h, cz - h],
        [cx - h, cy - h, cz + h],
        [cx + h, cy - h, cz + h],
        [cx + h, cy + h, cz + h],
        [cx - h, cy + h, cz + h]
    ];
}

// 球の内部判定
function insideSphere(x, y, z, cx, cy, cz, R) {
  const dx = x - cx;
  const dy = y - cy;
  const dz = z - cz;
  return (dx*dx + dy*dy + dz*dz) <= R*R;
}

// 球と cube の干渉判定
function intersectsSphereCube(sphereCenter, R, cx, cy, cz, size) {
    const h = size / 2;

    // cube の範囲
    const minX = cx - h;
    const maxX = cx + h;
    const minY = cy - h;
    const maxY = cy + h;
    const minZ = cz - h;
    const maxZ = cz + h;

    // 球の中心
    const sx = sphereCenter.x;
    const sy = sphereCenter.y;
    const sz = sphereCenter.z;

    // 球中心から cube に最も近い点を求める
    const px = Math.max(minX, Math.min(sx, maxX));
    const py = Math.max(minY, Math.min(sy, maxY));
    const pz = Math.max(minZ, Math.min(sz, maxZ));

    // 距離判定
    const dx = px - sx;
    const dy = py - sy;
    const dz = pz - sz;

    return (dx*dx + dy*dy + dz*dz) <= R*R;
}

// 親IDから8つの子IDを生成する（Octree）
function generateChildren(id) {
    return [
        id + "A",
        id + "B",
        id + "C",
        id + "D",
        id + "E",
        id + "F",
        id + "G",
        id + "H"
    ];
}

function carveSphere(id, L, sphereCenter, R, maxDepth) {
    const { x, y, z, size } = octantCenter(id, L);

    // cube の 8頂点を求める
    const corners = cubeCorners(x, y, z, size);

    // 完全内包チェック
    let allInside = true;
    for (const p of corners) {
        if (!insideSphere(p, sphereCenter, R)) {
            allInside = false;
            break;
        }
    }
    if (allInside) {
        return []; // 削除
    }

    // 完全外チェック
    if (!intersectsSphereCube(sphereCenter, R, x, y, z, size)) {
        return [id]; // そのまま残す
    }

    // 部分交差 → 細分化
    if (id.length >= maxDepth) {
        // これ以上細分化できない → 最小 cube
        return []; // 削る
    }

    // 子 cube を生成
    const children = generateChildren(id);

    // 子 cube を再判定
    let result = [];
    for (const child of children) {
        result.push(...carveSphere(child, L, sphereCenter, R, maxDepth));
    }
    return result;
}

function cut_sphere(ids_current, L, sphereCenter, R){
    const maxDepth = 8;
    let new_ids = [];

    for (const id of ids_current) {
        const result = carveSphere(id, L, sphereCenter, R, maxDepth);
        new_ids.push(...result);
    }

    ids_current = new_ids;
    return ids_current;
}
//---
let clayGroup = null;
let traceGroup = null;

document.getElementById("generateBtn").addEventListener("click", () => {

    const steps = Number(document.getElementById("rotSlider").value);

    // 古い軌跡を削除
    if (traceGroup) {
        scene.remove(traceGroup);
    }
    traceGroup = new THREE.Group();

    profilePoints.forEach(p_canvas => {

        // ★ 加工済みヘラは軌跡を生成しない
        if (p_canvas.processed) return;

        const p_clay = canvasToClay(p_canvas.x, p_canvas.z);
        const pts3d = generateRotationalPoints(p_clay, steps);

        pts3d.forEach(pt => {
            const geo = new THREE.SphereGeometry(p_canvas.R, 16, 16); // ★ 修正
            const mat = new THREE.MeshPhongMaterial({ color: 0xff4444 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(pt.x, pt.y, pt.z);
            traceGroup.add(mesh);
        });
    });

    scene.add(traceGroup);
});


document.getElementById("processBtn").addEventListener("click", () => {

    // 生成で描いた赤い球を消す
    if (traceGroup) {
        scene.remove(traceGroup);
        traceGroup = null;
    }

    const steps = Number(document.getElementById("rotSlider").value);
    let ids_current = model.ids;

    profilePoints.forEach(p => {
        if (p.processed) return;

        const clayPos = canvasToClay(p.x, p.z);
        const pts3d = generateRotationalPoints(clayPos, steps);

        pts3d.forEach(pt => {
            ids_current = cut_sphere(ids_current, model.L, pt, R);
        });

        p.processed = true;
    });

    model.ids = ids_current;
    redrawClayFromIDs(model.ids);
    draw();
});

function redrawClayFromIDs(ids) {

    if (clayGroup) scene.remove(clayGroup);

    const geo = new THREE.BoxGeometry(1, 1, 1);
    const mat = new THREE.MeshPhongMaterial({ color: 0xcccccc });

    const mesh = new THREE.InstancedMesh(geo, mat, ids.length);
    const dummy = new THREE.Object3D();

    ids.forEach((id, i) => {
        const { x, y, z, size } = octantCenter(id, model.L);

        dummy.position.set(x, y, z);
        dummy.scale.set(size, size, size);
        dummy.updateMatrix();

        mesh.setMatrixAt(i, dummy.matrix);
    });

    mesh.instanceMatrix.needsUpdate = true;

    clayGroup = mesh;
    scene.add(clayGroup);
}


const model = init_model(25.6);

const container = document.getElementById("threeContainer");
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    45,
    container.clientWidth / container.clientHeight,
    0.1,
    1000
);
camera.position.set(40, 40, 40);
/* camera.position.set(40, 0, 40);  */
camera.lookAt(0, 0, 0);
camera.up = new THREE.Vector3(0, 0, 1);


const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// OrbitControls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(30, 50, 30);
scene.add(light);

scene.add(new THREE.AmbientLight(0xffffff, 0.4));

function createClayCube(L){
    const geometry = new THREE.BoxGeometry(L, L, L);
    const material = new THREE.MeshPhongMaterial({
        color: 0xcccccc,
        transparent: true,
        opacity: 0.6
    });

    const cube = new THREE.Mesh(geometry, material);
    cube.position.set(0, 0, 0);
    return cube;
}

const clayCube = createClayCube(model.L);
scene.add(clayCube);

window.addEventListener("resize", () => {

    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
});

function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();

</script>

</html>
