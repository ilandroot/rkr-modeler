<!-- Three.js 読み込み -->
<script type="module">
import * as THREE from "https://esm.sh/three@0.152.2";
import { OrbitControls } from "https://esm.sh/three@0.152.2/examples/jsm/controls/OrbitControls.js";
/* ============================
   左：2D XZ Canvas
============================ */

const canvas = document.getElementById("xzCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let profilePoints = [];
let R = Number(document.getElementById("radiusSlider").value);

document.getElementById("radiusSlider").addEventListener("input", (e) => {
    const newR = Number(e.target.value);

    // ★ 未加工ヘラだけ半径を更新する
    profilePoints.forEach(p => {
        if (!p.processed) {
            p.R = newR;
        }
    });

    R = newR;  // グローバル R も更新しておく（新規ヘラ追加用）

    draw();
});

function getXZFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const z = e.clientY - rect.top;
    return { x, z };
}


document.getElementById("radiusSlider").addEventListener("input", () => {
    const newR = Number(radiusSlider.value);

    // 未加工ヘラだけ半径を更新
    profilePoints.forEach(p => {
        if (!p.processed) {
            p.R = newR;
        }
    });

    R = newR;
    draw();
    generate3D();
});

canvas.addEventListener("click", (e) => {

    const p_canvas = getXZFromEvent(e);

    profilePoints.push({
        x: p_canvas.x,
        z: p_canvas.z,
        R: R,              // ★ スライダーの半径を保存
        processed: false   // ★ 新規ヘラは未加工
    });

    draw();
    generate3D();

    previewPos = null;
});


const L = 25.6;

function drawClaySquare() {
    const w = canvas.width;
    const h = canvas.height;

    const cx = w / 2;
    const cz = h / 2;

    const scale = Math.min(w, h) * 0.8 / L;
    const half = (L / 2) * scale;

    ctx.strokeStyle = "#888";
    ctx.lineWidth = 2;

    ctx.strokeRect(cx - half, cz - half, half * 2, half * 2);
}

function draw() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // === 原点中心グリッド ===
    ctx.strokeStyle = "#ddd";
    ctx.lineWidth = 1;

    const cx = canvas.width / 2;
    const cz = canvas.height / 2;

    // 縦線（X方向）
    for (let gx = cx; gx < canvas.width; gx += 50) {
        ctx.beginPath();
        ctx.moveTo(gx, 0);
        ctx.lineTo(gx, canvas.height);
        ctx.stroke();
    }
    for (let gx = cx; gx > 0; gx -= 50) {
        ctx.beginPath();
        ctx.moveTo(gx, 0);
        ctx.lineTo(gx, canvas.height);
        ctx.stroke();
    }

    // 横線（Z方向）
    for (let gz = cz; gz < canvas.height; gz += 50) {
        ctx.beginPath();
        ctx.moveTo(0, gz);
        ctx.lineTo(canvas.width, gz);
        ctx.stroke();
    }
    for (let gz = cz; gz > 0; gz -= 50) {
        ctx.beginPath();
        ctx.moveTo(0, gz);
        ctx.lineTo(canvas.width, gz);
        ctx.stroke();
    }

    // ★ 赤い軸線（復活）
    ctx.strokeStyle = "#ff4444";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, canvas.height / 2);
    ctx.lineTo(canvas.width, canvas.height / 2);
    ctx.stroke();

    drawClaySquare();

    // 以下はヘラ描画（そのまま）
    ctx.strokeStyle = "#0077ff";
    ctx.lineWidth = 2;

    for (const p of profilePoints) {
        ctx.beginPath();

        const w = canvas.width;
        const h = canvas.height;
        const scale = Math.min(w, h) * 0.8 / L;

        const R_canvas = p.R * scale;

        ctx.strokeStyle = p.processed ? "#999" : "#0077ff";

        ctx.arc(p.x, p.z, R_canvas, 0, Math.PI * 2);
        ctx.stroke();
    }

    // === 回転軸（センターライン） ===
    ctx.strokeStyle = "#ff4444";   // 目立つ赤
    ctx.lineWidth = 2;

    // 縦のセンターライン（回転軸）
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.stroke();

    // 横のセンターライン（高さの基準）
    ctx.beginPath();
    ctx.moveTo(0, canvas.height / 2);
    ctx.lineTo(canvas.width, canvas.height / 2);
    ctx.stroke();

    // ヘラのプレビュー表示
    if (previewPos) {
        let R_prev = Number(document.getElementById("radiusSlider").value);
        const w = canvas.width;
        const h = canvas.height;
        const scale = Math.min(w, h) * 0.8 / L;
        const R_canvas_prev = R_prev * scale;


        ctx.strokeStyle = "rgba(0, 120, 255, 0.3)";
        ctx.beginPath();
        ctx.arc(previewPos.x, previewPos.z, R_canvas_prev, 0, Math.PI * 2);
        ctx.stroke();
    }


}

/* ============================
   右：Three.js 3D 粘土ビュー
============================ */

function init_model(size = 25.6){
    return {
        L: size,
        ids: ["A","B","C","D","E","F","G","H"]
    };
}
/* ============================
  Canvasから粘土への対応
*/
function canvasToClay(x_canvas, z_canvas) {
    const w = canvas.width;
    const h = canvas.height;

    const cx = w / 2;
    const cz = h / 2;

    const scale = Math.min(w, h) * 0.8 / L;

    const x_clay = (x_canvas - cx) / scale;

    // ★ Canvas の z は下が正 → Three.js の z は上が正
    const z_clay = -(z_canvas - cz) / scale;

    return { x: x_clay, z: z_clay };
}

function generateRotationalPoints(p, steps) {
    const pts = [];
    for (let i = 0; i < steps; i++) {
        const theta = (i / steps) * Math.PI * 2;
        const x = p.x * Math.cos(theta);
        const y = p.x * Math.sin(theta);  // y 軸まわりの回転
        const z = p.z;
        pts.push({ x, y, z });
    }
    return pts;
}

function carveSphereAtPoints(points, radius) {
    // 今は「削った位置に赤い球を置く」だけ
    points.forEach(pt => {
        const geo = new THREE.SphereGeometry(radius, 16, 16);
        const mat = new THREE.MeshPhongMaterial({ color: 0xff4444 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(pt.x, pt.y, pt.z);
        scene.add(mesh);
    });
}
//---
// Octant → center + size
function octantCenter(id, L) {
  let x = 0, y = 0, z = 0;
  let size = L;

  for (const c of id) {
    size /= 2;
    const h = size / 2;

    switch (c) {
      case "A": x += h; y += h; z += h; break;
      case "B": x -= h; y += h; z += h; break;
      case "C": x -= h; y -= h; z += h; break;
      case "D": x += h; y -= h; z += h; break;
      case "E": x += h; y += h; z -= h; break;
      case "F": x -= h; y += h; z -= h; break;
      case "G": x -= h; y -= h; z -= h; break;
      case "H": x += h; y -= h; z -= h; break;
    }
  }

  return { x, y, z, size };
}

// cube の 8つの頂点を返す
function cubeCorners(cx, cy, cz, size) {
    const h = size / 2;

    return [
        [cx - h, cy - h, cz - h],
        [cx + h, cy - h, cz - h],
        [cx + h, cy + h, cz - h],
        [cx - h, cy + h, cz - h],
        [cx - h, cy - h, cz + h],
        [cx + h, cy - h, cz + h],
        [cx + h, cy + h, cz + h],
        [cx - h, cy + h, cz + h]
    ];
}

// 球の内部判定
function insideSphere(x, y, z, cx, cy, cz, R) {
  const dx = x - cx;
  const dy = y - cy;
  const dz = z - cz;
  return (dx*dx + dy*dy + dz*dz) <= R*R;
}

// 球と cube の干渉判定
function intersectsSphereCube(sphereCenter, R, cx, cy, cz, size) {
    const h = size / 2;

    // cube の範囲
    const minX = cx - h;
    const maxX = cx + h;
    const minY = cy - h;
    const maxY = cy + h;
    const minZ = cz - h;
    const maxZ = cz + h;

    // 球の中心
    const sx = sphereCenter.x;
    const sy = sphereCenter.y;
    const sz = sphereCenter.z;

    // 球中心から cube に最も近い点を求める
    const px = Math.max(minX, Math.min(sx, maxX));
    const py = Math.max(minY, Math.min(sy, maxY));
    const pz = Math.max(minZ, Math.min(sz, maxZ));

    // 距離判定
    const dx = px - sx;
    const dy = py - sy;
    const dz = pz - sz;

    return (dx*dx + dy*dy + dz*dz) <= R*R;
}

// 親IDから8つの子IDを生成する（Octree）
function generateChildren(id) {
    return [
        id + "A",
        id + "B",
        id + "C",
        id + "D",
        id + "E",
        id + "F",
        id + "G",
        id + "H"
    ];
}

function carveSphere(id, L, sphereCenter, R, maxDepth) {
    const { x, y, z, size } = octantCenter(id, L);

    // cube の 8頂点を求める
    const corners = cubeCorners(x, y, z, size);

    // 完全内包チェック
    let allInside = true;
    for (const p of corners) {
        if (!insideSphere(p, sphereCenter, R)) {
            allInside = false;
            break;
        }
    }
    if (allInside) {
        return []; // 削除
    }

    // 完全外チェック
    if (!intersectsSphereCube(sphereCenter, R, x, y, z, size)) {
        return [id]; // そのまま残す
    }

    // 部分交差 → 細分化
    if (id.length >= maxDepth) {
        // これ以上細分化できない → 最小 cube
        return []; // 削る
    }

    // 子 cube を生成
    const children = generateChildren(id);

    // 子 cube を再判定
    let result = [];
    for (const child of children) {
        result.push(...carveSphere(child, L, sphereCenter, R, maxDepth));
    }
    return result;
}

function cut_sphere(ids_current, L, sphereCenter, R){
    const maxDepth = 8;
    let new_ids = [];

    for (const id of ids_current) {
        const result = carveSphere(id, L, sphereCenter, R, maxDepth);
        new_ids.push(...result);
    }

    ids_current = new_ids;
    return ids_current;
}

function classifyCell(cell) {
    const count = cell.points.length;

    if (count === 0) return "empty";
    if (count === cell.capacity) return "filled";
    return "mixed";  // 境界セル
}

function renderOctree(cell) {
    const type = classifyCell(cell);

    if (type === "mixed") {
        const geometry = new THREE.BoxGeometry(cell.size, cell.size, cell.size);
        const mesh = new THREE.Mesh(geometry, clayMaterial);

        // ★ 位置をセット（必須）
        mesh.position.set(cell.x, cell.y, cell.z);

        // ★ add は 1 回だけ
        scene.add(mesh);
    }

    if (cell.children) {
        for (const child of cell.children) {
            renderOctree(child);
        }
    }
}

//---
let clayGroup = null;
let traceGroup = null;
let previewPos = null;

function deleteActiveTool() {
    // ★ profilePoints の最後のヘラが active
    if (profilePoints.length > 0) {
        profilePoints.pop();
    }
}

function deleteActiveToolsAndRefresh(){
    deleteActiveTool();

    // ★ traceGroup を完全に消す
    if (traceGroup) {
        scene.remove(traceGroup);
        traceGroup = null;
    }

    draw();
    generate3D();   // 新しいヘラだけで再生成
}

function generate3D(){

    const steps = Number(document.getElementById("rotSlider").value);

    // 古い軌跡を削除
    if (traceGroup) {
        scene.remove(traceGroup);
        traceGroup = null;
    }

    traceGroup = new THREE.Group();

    profilePoints.forEach(p_canvas => {

        if (p_canvas.processed) return;

        const p_clay = canvasToClay(p_canvas.x, p_canvas.z);
        const pts3d = generateRotationalPoints(p_clay, steps);

        pts3d.forEach(pt => {
            const geo = new THREE.SphereGeometry(p_canvas.R, 16, 16);
            const mat = new THREE.MeshPhongMaterial({ color: 0xff4444 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(pt.x, pt.y, pt.z);
            traceGroup.add(mesh);
        });
    });

    // ★ ここが重要：traceGroup が空なら scene に追加しない
    if (traceGroup.children.length === 0) {
        traceGroup = null;
        return;
    }

    scene.add(traceGroup);
}

//-- event handler for 3D
document.getElementById("deleteToolBtn").addEventListener("click", deleteActiveToolsAndRefresh);

document.getElementById("deleteToolBtn").addEventListener("click", deleteActiveToolsAndRefresh);
draw();
document.getElementById("processBtn").addEventListener("click", () => {

    // 生成で描いた赤い球を消す
    if (traceGroup) {
        scene.remove(traceGroup);
        traceGroup = null;
    }

    const steps = Number(document.getElementById("rotSlider").value);
    let ids_current = model.ids;

    profilePoints.forEach(p => {
        if (p.processed) return;

        const clayPos = canvasToClay(p.x, p.z);
        const pts3d = generateRotationalPoints(clayPos, steps);

        pts3d.forEach(pt => {
            ids_current = cut_sphere(ids_current, model.L, pt, R);
        });

        p.processed = true;
    });

    model.ids = ids_current;
    redrawClayFromIDs(model.ids);
    draw();
});

document.getElementById("rotSlider").addEventListener("input", () => {
    generate3D();
});

document.getElementById("profileSlider").addEventListener("input", () => {
    generate3D();
});

canvas.addEventListener("mousemove", (e) => {
    previewPos = getXZFromEvent(e);
    draw();
});

function redrawClayFromIDs(ids) {

    if (clayGroup) scene.remove(clayGroup);

    const geo = new THREE.BoxGeometry(1, 1, 1);
    const mat = new THREE.MeshPhongMaterial({ color: 0xcccccc });

    const mesh = new THREE.InstancedMesh(geo, mat, ids.length);
    const dummy = new THREE.Object3D();

    ids.forEach((id, i) => {
        const { x, y, z, size } = octantCenter(id, model.L);

        dummy.position.set(x, y, z);
        dummy.scale.set(size, size, size);
        dummy.updateMatrix();

        mesh.setMatrixAt(i, dummy.matrix);
    });

    mesh.instanceMatrix.needsUpdate = true;

    clayGroup = mesh;
    scene.add(clayGroup);
}


const model = init_model(25.6);

function getTimestampFilename(model_name="myclay") {
    const d = new Date();

    const yyyy = d.getFullYear();
    const mm   = String(d.getMonth() + 1).padStart(2, '0');
    const dd   = String(d.getDate()).padStart(2, '0');

    const hh   = String(d.getHours()).padStart(2, '0');
    const mi   = String(d.getMinutes()).padStart(2, '0');
    const ss   = String(d.getSeconds()).padStart(2, '0');

    return `${model_name}-${yyyy}${mm}${dd}-${hh}${mi}${ss}.json`;
}

function saveClayModel() {
    const name = document.getElementById("modelNameInput").value;

    if (name.includes("-")) {
        alert("モデル名にハイフン（-）は使えません。別の名前を入力してください。");
        return;  // 保存処理を中断
    }

    const input = document.getElementById("modelNameInput").value.trim();
    const model_name = input === "" ? "myclay" : input;

    const filename = getTimestampFilename(model_name);

    const json = JSON.stringify(model, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = filename;   // ★ ユーザー指定名＋時刻
    a.click();

    URL.revokeObjectURL(url);
}

document.getElementById("saveBtn").addEventListener("click", () => {
    saveClayModel();
});

function resetModel() {

    // 粘土モデルの初期化
    const ini_model = init_model(25.6);
    model.L = ini_model.L;
    model.ids = ini_model.ids;

    // 加工ストロークの初期化
    profilePoints = [];

    // 3D の削除
    if (clayGroup) scene.remove(clayGroup);
    if (traceGroup) scene.remove(traceGroup);

    clayGroup = null;
    traceGroup = null;

    // Canvas 初期化
    draw();

    // 必要なら初期粘土を生成
    /* redrawClayFromIDs(model.ids);
    generate3D(); */
    createClayCube(model.L);

    document.getElementById("modelNameInput").value = "";
}


document.getElementById("resetBtn").addEventListener("click", () => {
    resetModel();
});

function loadClayModel(file) {
    const reader = new FileReader();

    reader.onload = (event) => {
        try {
            const data = JSON.parse(event.target.result);

            // ★ ファイル名からモデル名を抽出
            const filename = file.name;  // 例: myclay-20260911-152233.json
            // ★ まず .json を削除
            const noExt = filename.replace(/\.json$/i, "");

            const modelName = noExt.includes("-")
                ? noExt.split("-")[0]
                : noExt;

            // ★ input にセット
            document.getElementById("modelNameInput").value = modelName;

            // ★ 保存データは L と ids のみ
            model.L = data.L;
            model.ids = data.ids;

            // ★ profilePoints は空で初期化
            profilePoints = [];

            // ★ 古い 3D を消す（重要）
            if (traceGroup) {
                scene.remove(traceGroup);
            }

            if (clayGroup) {
                scene.remove(clayGroup);
            }

            redrawClayFromIDs(model.ids);

            // ★ 新しい 3D を生成
            generate3D();

            // ★ Canvas も再描画
            draw();

        } catch (err) {
            alert("JSON の読み込みに失敗しました");
            console.error(err);
        }
    };

    reader.readAsText(file);
}

document.getElementById("loadBtn").addEventListener("click", () => {
    document.getElementById("loadFileInput").click();
});

document.getElementById("loadFileInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) {
        loadClayModel(file);
    }
});


const container = document.getElementById("threeContainer");
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    45,
    container.clientWidth / container.clientHeight,
    0.1,
    1000
);
camera.position.set(40, 40, 40);
camera.lookAt(0, 0, 0);
camera.up = new THREE.Vector3(0, 0, 1);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// OrbitControls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight.position.set(30, 50, 30);
scene.add(dirLight);

scene.add(new THREE.AmbientLight(0xffffff, 0.3));

const hemiLight = new THREE.HemisphereLight(0x88aaff, 0x444444, 0.4);
scene.add(hemiLight);

// ★ 粘土マテリアル（質感改善）
const clayMaterial = new THREE.MeshStandardMaterial({
    color: 0xc8a27a,   // 粘土色
    roughness: 0.9,    // 表面のザラザラ感
    metalness: 0.0     // 粘土なので金属感ゼロ
});

function createClayCube(L){
    const geometry = new THREE.BoxGeometry(L, L, L);
    const material = new THREE.MeshPhongMaterial({
        color: 0xcccccc,
        transparent: true,
        opacity: 0.6
    });

    const cube = new THREE.Mesh(geometry, material);
    cube.position.set(0, 0, 0);
    return cube;
}

const clayCube = createClayCube(model.L);
scene.add(clayCube);

window.addEventListener("resize", () => {

    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
});

function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();

</script>
